name: Actualizar adjudicaciones UE

on:
  workflow_dispatch:

  schedule:
    # GitHub ejecuta el cron en UTC.
    # Se activa cada hora y se comprueba la hora española.
    - cron: "17 * * * 1-6"

permissions:
  contents: write

concurrency:
  group: actualizar-adjudicaciones-ue
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar horario de España
        id: horario
        shell: bash
        run: |
          HORA="$(TZ=Europe/Madrid date +%H)"
          MINUTO="$(TZ=Europe/Madrid date +%M)"
          DIA="$(TZ=Europe/Madrid date +%u)"

          echo "Hora española: ${HORA}:${MINUTO}"
          echo "Día de la semana: ${DIA}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "ejecutar=si" >> "$GITHUB_OUTPUT"
          elif [[ "${DIA}" -ge 1 && "${DIA}" -le 6 ]] && \
               [[ "${HORA}" == "07" || \
                  "${HORA}" == "12" || \
                  "${HORA}" == "17" || \
                  "${HORA}" == "22" ]]; then
            echo "ejecutar=si" >> "$GITHUB_OUTPUT"
          else
            echo "ejecutar=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Python
        if: steps.horario.outputs.ejecutar == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        if: steps.horario.outputs.ejecutar == 'si'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear RSS
        if: steps.horario.outputs.ejecutar == 'si'
        shell: bash
        run: |
          python actualizar_rss.py

          echo "Archivos después de ejecutar Python:"
          ls -la

          if [ ! -f feed.xml ]; then
            echo "ERROR: no se ha creado feed.xml"
            exit 1
          fi

          if [ ! -s feed.xml ]; then
            echo "ERROR: feed.xml está vacío"
            exit 1
          fi

          echo "feed.xml creado correctamente"

      - name: Comprobar RSS
        if: steps.horario.outputs.ejecutar == 'si'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          archivo = Path("feed.xml")

          if not archivo.exists():
              raise SystemExit("ERROR: no existe feed.xml")

          if archivo.stat().st_size == 0:
              raise SystemExit("ERROR: feed.xml está vacío")

          raiz = ET.parse(archivo).getroot()
          entradas = raiz.findall("./channel/item")

          print("RSS XML correcto.")
          print(f"Tamaño: {archivo.stat().st_size} bytes")
          print(f"Entradas encontradas: {len(entradas)}")

          if entradas:
              titulo = entradas[0].findtext("title")
              print("Primer título:")
              print(titulo)
          else:
              print(
                  "El RSS es válido, aunque todavía "
                  "no contiene adjudicaciones."
              )
          PY

      - name: Guardar RSS actualizado
        if: steps.horario.outputs.ejecutar == 'si'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml historial.json

          if git diff --cached --quiet; then
            echo "Proceso correcto: no hay cambios nuevos."
          else
            git commit -m "Actualizar adjudicaciones UE"
            git push
          fi

      - name: Fuera del horario
        if: steps.horario.outputs.ejecutar != 'si'
        run: |
          echo "No corresponde ejecutar en esta hora."
